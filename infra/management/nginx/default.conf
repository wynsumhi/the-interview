events {
    worker_connections 1024;
}
http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen      80;
        server_name j14a307.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen      443                ssl;
        server_name j14a307.p.ssafy.io;

        ssl_certificate           /etc/letsencrypt/live/j14a307.p.ssafy.io/fullchain.pem;
        ssl_certificate_key       /etc/letsencrypt/live/j14a307.p.ssafy.io/privkey.pem;
        ssl_protocols             TLSv1.2                                                TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 0;

        proxy_connect_timeout 300;
        proxy_send_timeout    300;
        proxy_read_timeout    300;
        send_timeout          300;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  443;
        proxy_redirect   http://           https://;


        # 1. 중계 서버 9123
        location /infra/webhook {
            set        $bridge_upstream http://bridgeserver:9123;
            proxy_pass $bridge_upstream;
        }

        # 2. 젠킨스 Jenkins: 8989
        location /infra/jenkins {
            set        $jenkins_upstream http://jenkins:8989;
            proxy_pass $jenkins_upstream;

            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  443;

            # 젠킨스 검증 통과를 위한 핵심 헤더
            proxy_set_header X-Forwarded-Host $host;
        }

        # 3. BE
        location /api {
            set        $backend_url http://backend:8080;
            proxy_pass $backend_url;
        }

        # 4. FE
        location / {
            set        $frontend_url http://frontend:3000;
            proxy_pass $frontend_url;
        }
    }
}