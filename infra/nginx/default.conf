events {
    worker_connections 1024;
}
http {
    resolver 127.0.0.11 valid=30s;

    server {
        listen      80;
        server_name j14a307.p.ssafy.io;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 "Certbot 준비 완료";
        }

        # 1. 중계 서버 9123
        location /infra/webhook {
            set        $bridge_upstream http://bridgeserver:9123;
            proxy_pass $bridge_upstream;
        }

        # 2. 젠킨스 Jenkins: 8989
        location /infra/jenkins {
            set                  $jenkins_upstream http://jenkins:8989;
            proxy_pass           $jenkins_upstream;
            client_max_body_size 0;
            proxy_http_version   1.1;
            proxy_set_header     Upgrade           $http_upgrade;
            proxy_set_header     Connection        "upgrade";
        }
    }
}