# 인증 설정
auth_enabled: false # 멀티테넌시(사용자별 분리) 기능을 끕니다. 혼자 사용할 때는 false가 기본입니다.

server:
  http_listen_port: 3100 # Grafana나 Promtail이 접속할 HTTP 포트입니다.
  grpc_listen_port: 9096 # Loki 내부 컴포넌트끼리 통신할 때 사용하는 고속 포트입니다.
  http_listen_address: 0.0.0.0 # 외부에서 동작중인 FastAPI 서버를 위함

# 공통 저장소 및 네트워크 설정
common:
  instance_addr: 127.0.0.1 # 단일 서버 실행 시 자기 자신을 가리키는 루프백 주소입니다.
  path_prefix: /loki      # Loki가 데이터를 저장할 컨테이너 내부의 기본 경로입니다.
  storage:
    filesystem: # 로컬 디스크(파일시스템)를 저장소로 사용하겠다는 선언입니다.
      chunks_directory: /loki/chunks # 실제 로그 본문(데이터 덩어리)이 저장되는 폴더입니다.
      rules_directory: /loki/rules   # 알람(Alerting) 규칙 파일이 저장되는 폴더입니다.
  replication_factor: 1   # 데이터 복제본 개수입니다. 서버가 1대이므로 1로 설정합니다.
  ring: # Loki 내부의 일관성을 유지하기 위한 관리 시스템 설정입니다.
    kvstore:
      store: inmemory     # 별도의 DB 없이 메모리 상에서 주소록(Ring)을 관리합니다.

# 로그 보관 정책 (Retention) 설정
limits_config:
  retention_period: 720h # 30일 보관

# 검색 차단 ( 지정 기간이 지난 데이터는 아예 검색을 안함 성능 최적화 )
chunk_store_config:
  max_look_back_period: 720h # 30일 이전 데이터는 쳐다보지 않음

# 데이터 구조(스키마) 설정
schema_config:
  configs:
    - from: 2020-10-24     # 이 설정이 적용되기 시작할 날짜입니다. (과거 날짜면 무관)
      store: tsdb          # 최신 인덱스 저장 방식인 TSDB를 사용합니다. (성능 우수)
      object_store: filesystem # 로그 본문을 로컬 디스크에 저장합니다.
      schema: v13          # Loki의 최신 데이터 구조 버전입니다.
      index:
        prefix: index_     # 생성되는 인덱스 파일의 이름 접두사입니다.
        period: 24h        # 인덱스 파일을 24시간 단위로 쪼개서 생성합니다. (관리 용이)

# 실제 삭제를 수행하는 설정
compactor:
  working_directory: /loki/retention # 삭제 작업을 진행할 때 임시로 사용할 작업 공간입니다.
  compaction_interval: 30m           # 30분마다 한 번씩 "지울 로그가 있는지" 감시합니다.
  retention_enabled: true            # 위에서 설정한 retention_period에 따라 삭제를 실행할지 여부입니다. (필수: true)
  retention_delete_delay: 2h         # 삭제 대상으로 선정된 후, 실제 삭제까지 2시간의 유예 기간을 둡니다.
  retention_delete_worker_count: 150 # 삭제 작업을 수행할 스레드(일꾼) 수입니다.