services:
  backend:
    build:
      context: ../../be/theinterview
      dockerfile: Dockerfile
    container_name: backend
    restart: on-failure
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=database
      - REDIS_HOST=redis
      - JAVA_OPTS=-Xms1024m -Xmx2048m
    networks:
      - theinterview-net
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ../../fe
      dockerfile: Dockerfile
    container_name: frontend
    restart: on-failure
    depends_on:
      - backend
    networks:
      - theinterview-net
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  theinterview-net:
    external: true