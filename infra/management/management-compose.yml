services:
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: on-failure
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/infra/nginx/www:/var/www/certbot:ro
      - /home/ubuntu/infra/nginx/certs:/etc/letsencrypt:ro
      - /home/ubuntu/theInterview/history:/var/www/html/history:ro
    environment:
      - TZ=Asia/Seoul
    networks:
      - theinterview-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: on-failure
    user: root
    deploy:
      resources:
        limits:
          memory: 3G
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins
      - jenkins_home:/var/jenkins_home
    environment:
      - JENKINS_OPTS=--prefix=/infra/jenkins --httpPort=8989
      - TZ=Asia/Seoul
    networks:
      - theinterview-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # ports:
    #   - "8989:8989"
    #   - "50000:50000"

  bridgeserver:
    build: ../webhook-service
    container_name: bridgeserver
    restart: on-failure
    env_file:
      - .env
    networks:
      - theinterview-net
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=Asia/Seoul
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    #ports:
    # - 9123:9123

networks:
  theinterview-net:
    external: true

volumes:
  jenkins_home: { }