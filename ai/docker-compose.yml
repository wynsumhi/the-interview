services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-fastapi
    env_file:
      - .env
    environment:
      DEFAULT_TTS_PROVIDER: cuda
      DEFAULT_TTS_AUTO_DOWNLOAD: "true"
      DEFAULT_TTS_PRELOAD_ON_STARTUP: "true"
      DEFAULT_EMBEDDING_BASE_URL: http://embedding-server:8000/v1
      QDRANT_URL: http://qdrant:6333
      UVICORN_WORKERS: "1"
    depends_on:
      - embedding-server
      - qdrant
    gpus: all
    ports:
      - "8000:8000"
    volumes:
      - supertonic-cache:/root/.cache
    restart: unless-stopped

  embedding-server:
    image: vllm/vllm-openai:latest
    container_name: ai-embedding-server
    env_file:
      - .env
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command:
      - Qwen/Qwen3-Embedding-0.6B
      - --runner
      - pooling
      - --dtype
      - half
      - --gpu-memory-utilization
      - "0.75"
      - --max-model-len
      - "8192"
    gpus: all
    ports:
      - "8001:8000"
    ipc: host
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  supertonic-cache:
  huggingface-cache:
  qdrant-storage:
