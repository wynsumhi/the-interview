services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://j14a307.p.ssafy.io/infra/prometheus/'
      - '--web.route-prefix=/'
    networks:
      - theinterview-net
    #ports:
    #  - "9090:9090"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: "host"
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - '/:/host:ro'
    command:
      - '--path.rootfs=/host'
    network_mode: "host"
    #ports:
    #  - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # 리눅스 커널의 메시지 버퍼에 접근할 수 있게 해주는 장치 파일
    devices:
      - /dev/kmsg
    networks:
      - theinterview-net
    #ports:
    #  - "8080:8080"
    # port가 BE 스프링이랑 겹치기 때문에 오픈시 주의필요

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 300M
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://j14a307.p.ssafy.io/infra/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    networks:
      - theinterview-net
    #ports:
    #  - "3001:3000"
    # port가 FE이랑 겹치기 때문에 오픈시 주의필요

networks:
  theinterview-net:
    external: true

volumes:
  grafana-storage: