version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ssafy1234!
      POSTGRES_DB: the_interview
      TZ: Asiz/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Seoul
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: