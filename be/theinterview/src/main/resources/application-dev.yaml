spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    root: INFO
    com.theinterview: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWTSECRET}
  # 토큰 만료 시간 (초 단위) 개발 편의 상 모두 14일로 설정-
  access-token-validity-in-seconds: 1209600
  refresh-token-validity-in-seconds: 1209600

# 사용자 답변 음성 파일 저장 경로(배포)
file:
  audio:
    base-path: ${SERVER_AUDIO_PATH}

# fastAPI 호출 경로
fastapi:
  base-path: ${FASTAPI_SERVER_URL}