server:
  servlet:
    context-path: /api
  forward-headers-strategy: framework

spring:
  profiles:
    active: local
  application:
    name: the-interview
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  sql:
    init:
      mode: always

springdoc:
  api-docs:
    path: /v1/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true