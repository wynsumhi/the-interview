repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix, --config=ai/pyproject.toml]
        files: ^ai/(app|tests)/.*\.py$
      - id: ruff-format
        args: [--config=ai/pyproject.toml]
        files: ^ai/(app|tests)/.*\.py$
