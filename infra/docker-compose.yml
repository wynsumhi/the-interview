services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
    networks:
      - infra-network

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: on-failure
    volumes:
      - /home/ubuntu/jenkins-data:/var/jenkins_home
    environment:
      - JENKINS_OPTS=--prefix=/infra/jenkins
    networks:
      - infra-network
      # ports:
      #   - "8080:8080"
      #   - "50000:50000"

  bridgeserver:
    build: ./webhook-service
    container_name: bridgeserver
    restart: on-failure
    env_file:
      - ./webhook-service/.env
    networks:
      - infra-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    environment:
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    #ports:
    # - 9123:9123

  database:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - infra-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    #ports:
    #  - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis-db
    restart: always
    command: redis-server --port 6379
    volumes:
      - redis_data:/data
    networks:
      - infra-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    #ports:
    # - "6379:6379"

networks:
  infra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local